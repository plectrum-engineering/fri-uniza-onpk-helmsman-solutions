apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rocket-rentals
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      client: rocket-rentals
replicas:
  - name: storefront-podinfo
    count: 3
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.14.0          # client is certified on 6.14 only
patches:
  - target:
      kind: Deployment
      name: storefront-podinfo
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront-podinfo
      spec:
        template:
          spec:
            containers:
              - name: podinfo
                env:
                  - name: PODINFO_UI_COLOR
                    value: "#1565c0"
                  - name: PODINFO_UI_MESSAGE
                    value: "Rocket Rentals - to the moon and back"

apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-frontend"
  labels:
    {{- include "guestbook.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ .Values.tests.image }}
      command: ["sh", "-c"]
      args:
        - wget -qO- http://frontend:{{ .Values.frontend.service.port }} | grep -i guestbook

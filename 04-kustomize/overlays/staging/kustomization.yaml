apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-staging
namePrefix: staging-

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      env: staging

replicas:
  - name: podinfo
    count: 2

# staging tests the next version before prod gets it
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.15.0

configMapGenerator:
  - name: podinfo-ui
    behavior: merge
    literals:
      - PODINFO_UI_MESSAGE=Release candidate - staging
      - PODINFO_UI_COLOR=#f9a825

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-prod
namePrefix: prod-

resources:
  - ../../base
  - namespace.yaml
  - pdb.yaml

labels:
  - pairs:
      env: prod

replicas:
  - name: podinfo
    count: 3

configMapGenerator:
  - name: podinfo-ui
    behavior: merge
    literals:
      - PODINFO_UI_MESSAGE=Production - handle with care
      - PODINFO_UI_COLOR=#c62828

patches:
  # strategic merge patch: more resources for prod
  - path: resources-patch.yaml
  # JSON 6902 patch: switch the log level (list item by index)
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/3
        value: --level=warn

# uncomment during an outage:
# components:
#   - ../../components/maintenance

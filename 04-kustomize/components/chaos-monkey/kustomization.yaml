apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Makes podinfo randomly slow and randomly failing - great for testing probes & retries.
patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/4
        value: --random-delay=true
      - op: replace
        path: /spec/template/spec/containers/0/command/5
        value: --random-error=true
      - op: add
        path: /metadata/annotations
        value:
          onpk.io/chaos: "enabled"
